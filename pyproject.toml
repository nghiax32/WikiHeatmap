[project]
name = "wikiheatmap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.118",
    "confluent-kafka==2.15.1",
]

[dependency-groups]
# Spark jobs (analysis/): batch, streaming, loading PostgreSQL. Image wikiheatmap-spark.
spark = [
    "psycopg2-binary==2.9.13",
    "pyspark==4.3.0",
]
dbt = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
]
# Everything, for development on the host (uv sync installs dev by default).
dev = [
    { include-group = "spark" },
    { include-group = "dbt" },
]
