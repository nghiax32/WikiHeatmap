services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: wikiheatmap-kafka
    ports:
      - "9092:9092"
    environment:
      # One node is both broker and controller (KRaft, no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Base64 UUID, fixed so the volume stays valid across restarts.
      CLUSTER_ID: ovQskuB-S7CHWrUs3FziXQ
      # PLAINTEXT for other containers (kafka:19092), PLAINTEXT_HOST for the host (localhost:9092).
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: internal topics cannot have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (3 partitions, see CLAUDE.md), not on first produce.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always

  # One-shot: creates topics, then exits. Re-run by hand: docker compose run --rm kafka-init
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: wikiheatmap-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/sh", "/create_topics.sh"]
    restart: "no"

  # S3-compatible object storage (master, volume, filer and S3 gateway in one process).
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: wikiheatmap-seaweedfs
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"  # S3 API
    environment:
      # Local development credentials; override in .env.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-wikiheatmap}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-wikiheatmap-secret}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # One-shot: creates buckets, then exits. Re-run by hand: docker compose run --rm seaweedfs-init
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.50
    container_name: wikiheatmap-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./scripts/create_buckets.sh:/create_buckets.sh:ro
    entrypoint: ["/bin/sh", "/create_buckets.sh"]
    restart: "no"

  # Warehouse: raw.edits (loaded by Spark) and the dbt models (schema analytics).
  postgres:
    image: postgres:16.15
    container_name: wikiheatmap-postgres
    ports:
      - "5432:5432"
    environment:
      # Local development credentials; override in .env.
      POSTGRES_DB: wikiheatmap
      POSTGRES_USER: ${PG_USER:-wikiheatmap}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-wikiheatmap-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # One-shot: creates the airflow database, then exits.
  postgres-init:
    image: postgres:16.15
    container_name: wikiheatmap-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${PG_USER:-wikiheatmap}
      PGPASSWORD: ${PG_PASSWORD:-wikiheatmap-secret}
      PGDATABASE: wikiheatmap
    volumes:
      - ./scripts/create_databases.sh:/create_databases.sh:ro
    entrypoint: ["/bin/sh", "/create_databases.sh"]
    restart: "no"

  # Scheduler, API server and DAG processor in one container (single node).
  # UI on http://localhost:8081 (8080 is often taken; AIRFLOW_PORT), no login (local only). The DAG starts its
  # tasks as containers through the Docker socket (DockerOperator).
  airflow:
    image: apache/airflow:3.3.2-python3.12
    container_name: wikiheatmap-airflow
    command: ["standalone"]
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-wikiheatmap}:${PG_PASSWORD:-wikiheatmap-secret}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Passed on to the job containers by the DAG.
      PG_USER: ${PG_USER:-wikiheatmap}
      PG_PASSWORD: ${PG_PASSWORD:-wikiheatmap-secret}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wikiheatmap}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wikiheatmap-secret}
    group_add:
      # Group owning /var/run/docker.sock on the host (stat -c %g /var/run/docker.sock).
      - "${DOCKER_GID:-984}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Job images run by the Airflow DAG, also runnable by hand, e.g.
  #   docker compose run --rm load-edits python load_postgres.py <path> <start> <end>
  #   docker compose run --rm dbt build
  # Profile "jobs": built by `docker compose --profile jobs build`, never started by `up`.
  load-edits:
    profiles: ["jobs"]
    image: wikiheatmap-spark
    build:
      context: .
      dockerfile: spark.Dockerfile
    environment:
      PG_HOST: postgres
      PG_USER: ${PG_USER:-wikiheatmap}
      PG_PASSWORD: ${PG_PASSWORD:-wikiheatmap-secret}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wikiheatmap}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wikiheatmap-secret}

  dbt:
    profiles: ["jobs"]
    image: wikiheatmap-dbt
    build:
      context: .
      dockerfile: dbt.Dockerfile
    environment:
      PG_HOST: postgres
      PG_USER: ${PG_USER:-wikiheatmap}
      PG_PASSWORD: ${PG_PASSWORD:-wikiheatmap-secret}

  # Streaming query 1: live 1-hour ranking, Kafka -> realtime.page_editors_1h.
  # On its first start it reads Kafka from 65 minutes back, so the window is
  # full at once; afterwards the checkpoint (volume) decides where to resume.
  stream-top-pages:
    build:
      context: .
      dockerfile: spark.Dockerfile
    image: wikiheatmap-spark
    container_name: wikiheatmap-stream-top-pages
    command:
      - sh
      - -c
      - >-
        exec python stream_top_pages.py --checkpoint /state/checkpoints/top_pages_1h
        --starting-timestamp "$$(date -u -d '-65 min' '+%F %T')"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PG_HOST: postgres
      PG_USER: ${PG_USER:-wikiheatmap}
      PG_PASSWORD: ${PG_PASSWORD:-wikiheatmap-secret}
    volumes:
      - spark-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Dashboard on http://localhost:3000. Its own settings (users, questions,
  # dashboards) live in an H2 file in the volume; scripts/setup_metabase.py creates them.
  metabase:
    image: metabase/metabase:v0.65.4.1
    container_name: wikiheatmap-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: always

  # EventStreams -> Kafka. Set WIKI_CONTACT (email or URL) in .env.
  producer:
    build: .
    image: wikiheatmap-app
    container_name: wikiheatmap-producer
    command: ["python", "scripts/produce_recentchange.py"]
    environment:
      WIKI_CONTACT: ${WIKI_CONTACT:-}
      KAFKA_BOOTSTRAP: kafka:19092
      STATE_FILE: /state/last_event_id
    volumes:
      - producer-state:/state
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Kafka -> hourly JSONL.gz on SeaweedFS. Temporary until the Spark raw query (Step 7).
  archiver:
    build: .
    image: wikiheatmap-app
    container_name: wikiheatmap-archiver
    command: ["python", "scripts/archive_raw.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wikiheatmap}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wikiheatmap-secret}
      FLUSH_INTERVAL_SECONDS: ${ARCHIVE_FLUSH_INTERVAL_SECONDS:-300}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
  seaweedfs-data:
  producer-state:
  postgres-data:
  metabase-data:
  spark-state:
